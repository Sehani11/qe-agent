# ── Ingest Confluence / Jira by URL, 2026-08-22 ─────────────────────────────
# Both ingestion forms gained a method selector (tablist, matching
# GitHubSourceSelector) and a URL path, recorded in
# maintenance-2026-08-22-ingest-by-url.md. Confluence: "Whole space" (default)
# or "Page URLs" (page URLs and/or bare ids). Jira: "Whole project" (default)
# or "Ticket URLs" (issue URLs and/or bare keys). Previously you could only take
# an entire space or an entire project.
#
# Only the FETCH step changed: fetch_page_by_id / fetch_ticket_content return the
# same types as the bulk fetchers, so chunking, embedding, SSE progress and
# persistence stay shared. New confluence_service.extract_page_id(); Jira needed
# no new parsing (fetch_ticket_content already took a URL or a key). Both paths
# dedupe before embedding. JiraIngestRequest.project_key is now optional, guarded
# by a model validator so a body with neither source is still a 422.
# No schema change. Story banners: 4-1, 4-2, 4-5.

# ── Runtime model selection, 2026-08-23 ────────────────────────────────────
# Provider and model became per-request rather than per-process: every LLM
# request carries llm_provider/llm_model, and get_llm_provider() takes them as
# arguments with LLM_PROVIDER/LLM_MODEL as the fallback for callers that have no
# request behind them. Keys split per vendor (OPENAI_API_KEY/ANTHROPIC_API_KEY);
# LLM_API_KEY still serves whichever provider LLM_PROVIDER names and is never a
# fallback for another — handing an OpenAI key to Anthropic passed the
# "is a key set" guard and failed later as a 401 that read like a broken account.
#
# ClaudeProvider.generate_with_tools was NOT implemented, and the agentic runner
# catches per-scenario LLM errors then emits `complete` regardless — so choosing
# Claude produced a run that finished, toasted success, and verified nothing. It
# is implemented now, and LLMProvider.supports_tools lets verification refuse a
# tool-less provider with a 400 up front. No schema change.
# Recorded in maintenance-2026-08-23-runtime-model-selection.md.
# Story banners: 1-3, 2-5, 5-1, 5-5.

# ── Closing the training-data loop, 2026-08-23 ─────────────────────────────
# Epic 6 shipped capture, consent, dataset build and fine-tuning, but no session
# data had ever trained a model — run-5's 204 examples came entirely from the
# static corpus. Three independent defects, each sufficient alone:
#   1. scenariosToGherkin() emitted steps with no Given/When/Then keywords, so
#      every edited/uploaded row was dropped as "incomplete steps". Fixed
#      forward only; rows written before this stay unparsable.
#   2. --db-source had no `edited`, so the highest-value rows were reachable
#      only via `all` (which drags in self-distillation). Added `edited` and
#      `authored`; default unchanged.
#   3. The builder ignored bdd_files.acceptance_criteria and back-generated a
#      replacement — paying an LLM to invent worse input than the real ticket
#      text already stored. Stored pairs now skip back-generation entirely.
#
# TRAINING_DATA_OPT_IN became the deployment POLICY, ANDed with a per-request
# consent flag so a client can only narrow it. Also closed an embeddings
# regression from the key split, and added a suite-wide network block after a
# test was caught making real OpenAI calls. No schema change.
# Recorded in maintenance-2026-08-23-training-data-loop.md.
# Story banners: 6-4, 6-5, 6-6.

# ── Projects and credential scoping, 2026-08-23 ────────────────────────────
# Sessions became project-scoped. `projects` holds per-project Jira / Confluence
# / GitHub settings plus a default model; credentials are Fernet-ENCRYPTED (not
# hashed — they are replayed to their APIs, so the plaintext must be
# recoverable) under CREDENTIAL_ENCRYPTION_KEY held outside the DB, and are
# never serialized back (has_*_token booleans only).
#
# Resolution is all-or-nothing per integration: a project supplies its whole
# credential set or none of it, so a project base URL is never paired with an
# environment token. LLM API keys stay system config — they are billing
# credentials for the deployment — while the provider/model CHOICE is a project
# default the UI prepopulates from and the user can override.
#
# Knowledge moved to one namespace per project. Migrations 8c4760c0942a and
# fc81d4a9e05c (head), both applied 2026-08-23: 37 sessions and 20 knowledge
# sources moved into Project-1; 9 vectors COPIED (not moved) by
# scripts/migrate_knowledge_vectors.py, source namespace left intact.
# First frontend use of Zustand (active project id only; server data stays in
# React Query).
# Recorded in maintenance-2026-08-23-projects-and-credential-scoping.md.
