[project]
name = "qe-agent-v2-backend"
version = "0.1.0"
description = "FastAPI backend for BDD-AutoGen (qe-agent-v2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pinecone>=6.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.7.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "supabase>=2.0.0",
    "json-repair>=0.30.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "reportlab>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
